{% extends 'website/base.html' %}
{% block content %}
<form action="" method="post">
    {% csrf_token %}
    {{ wizard.management_form }}
    {{ wizard.form.as_p }}

    {% if wizard.steps.prev %}
        <button name="wizard_goto_step" type="submit" value="{{ wizard.steps.prev }}">Back</button>
    {% endif %}

    <button type="submit">Next</button>
</form>
{% endblock %}
